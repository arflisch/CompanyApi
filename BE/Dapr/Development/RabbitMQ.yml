apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: rabbitmq-pubsub
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
  - name: connectionString
    value: "amqp://admin:admin@127.0.0.1:5672"
  - name: durable
    value: "true"
  - name: deletedWhenUnused
    value: "false"
  - name: consumerID
    value: "channel1"
scopes:
- company-api
- notification-service

